<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #020208;
    font-family: monospace;
  }
  canvas {
    display: block;
  }
  .overlay {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
    letter-spacing: 4px;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
  }
</style>
</head>
<body>

<canvas id="geminin"></canvas>
<div class="overlay">AI DUALITY CORE // GEMININ ACTIVE</div>

<script>
const canvas = document.getElementById('geminin');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let time = 0;

class NeuralNode {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.baseX = x;
    this.baseY = y;
    this.color = color;
    this.size = Math.random() * 2.5 + 1;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.02 + 0.01;
    this.range = Math.random() * 30 + 10;
  }

  update() {
    this.angle += this.speed;
    this.x = this.baseX + Math.cos(this.angle) * this.range;
    this.y = this.baseY + Math.sin(this.angle) * this.range;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const cx = canvas.width / 2;
const cy = canvas.height / 2;
const nodes = [];

// Create twin structural clusters (The Gemini Twins)
const count = 45;
for (let i = 0; i < count; i++) {
  const theta = (i / count) * Math.PI * 2;
  const radius = 120 + Math.sin(i * 3) * 40;
  
  // Left core (Cyan / Electric Blue)
  nodes.push(new NeuralNode(cx - 180 + Math.cos(theta) * radius, cy + Math.sin(theta) * radius * 0.8, '#00f2fe'));
  
  // Right core (Magenta / Deep Violet)
  nodes.push(new NeuralNode(cx + 180 + Math.cos(theta) * radius, cy + Math.sin(theta) * radius * 0.8, '#7928ca'));
}

function animate() {
  ctx.fillStyle = 'rgba(2, 2, 8, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  time += 0.03;

  // Draw connecting synchronization webs
  for (let i = 0; i < nodes.length; i++) {
    nodes[i].update();
    nodes[i].draw();

    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 90) {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.strokeStyle = nodes[i].color === nodes[j].color 
          ? (nodes[i].color === '#00f2fe' ? 'rgba(0, 242, 254, 0.15)' : 'rgba(121, 40, 202, 0.15)')
          : 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
  }

  // Draw Central Quantum Bridge Pulse
  const bridgeX = cx + Math.sin(time) * 40;
  ctx.beginPath();
  ctx.arc(bridgeX, cy + Math.cos(time * 2) * 20, 6 + Math.sin(time * 4) * 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00f2fe';
  ctx.fill();
  ctx.shadowBlur = 0;

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
