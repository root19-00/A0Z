<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #050505;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<canvas id="butterfly"></canvas>

<script>
const canvas =getElementByIdSafe('butterfly');
function getElementSafe(id) { return document.getElementById(id); }
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let time = 0;

function drawButterfly(x, y, scale, angle, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  // Wings (Parametric Butterfly Curve by Temple H. Fay)
  ctx.beginPath();
  for (let t = 0; t < 2 * Math.PI; t += 0.01) {
    const term = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.pow(Math.sin(t / 12), 5);
    const px = Math.sin(t) * term * 25;
    const py = -Math.cos(t) * term * 25;
    if (t === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.ellipse(0, 0, 3, 20, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();

  ctx.restore();
}

const particles = [];
for (let i = 0; i < 7; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    scale: 0.8 + Math.random() * 1.2,
    speed: 0.5 + Math.random() * 1.5,
    angleOffset: Math.random() * 10,
    color: `hsla(${180 + Math.random() * 120}, 80%, 60%, 0.7)`
  });
}

function animate() {
  ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  time += 0.03;

  particles.forEach((p, index) => {
    p.y -= p.speed;
    p.x += Math.sin(time + p.angleOffset) * 1.5;

    if (p.y < -50) {
      p.y = canvas.height + 50;
      p.x = Math.random() * canvas.width;
    }

    const flutter = Math.sin(time * 5 + index) * 0.3;
    drawButterfly(p.x, p.y, p.scale + flutter, Math.sin(time + index) * 0.2, p.color);
  });

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
