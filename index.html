<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Rayquaza | Portal Workspace</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #141c2e;
            --panel-border: #1e293b;
            --accent-color: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 15px var(--accent-glow);
            box-sizing: border-box;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #0b0f19;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #successState {
            display: none;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--panel-border);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 15px;
        }
        .highlight {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- نموذج الدخول -->
        <div id="formState">
            <div class="logo">RAYQUAZA</div>
            <div class="subtitle">Secure Workspace Authentication</div>

            <form id="workspaceForm">
                <div class="form-group">
                    <label for="username">Username / ID</label>
                    <input type="text" id="username" required autocomplete="off" placeholder="Enter identifier">
                </div>
                <div class="form-group">
                    <label for="passcode">Security Key</label>
                    <input type="password" id="passcode" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Connect Session</button>
            </form>
        </div>

        <!-- حالة نجاح الاتصال / الانتظار -->
        <div id="successState">
            <div class="logo">RAYQUAZA</div>
            <div class="subtitle">Session Initializing</div>
            <div class="spinner"></div>
            <p class="info-text">
                Authenticating node for <span id="displayName" class="highlight"></span>...<br>
                Establishing secure pipeline.
            </p>
        </div>
    </div>

    <script>
        document.getElementById("workspaceForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;

            // تبديل الواظفة لعرض حالة التحميل
            document.getElementById("formState").style.display = "none";
            document.getElementById("displayName").innerText = username;
            document.getElementById("successState").style.display = "block";

            // هنا يمكنك تجربة إضافة الكود الخاص بك لإرسال البيانات للسيرفر أو الـ Firebase تدريجياً
            console.log("Workspace session requested for:", username);
        });
    </script>
</body>
</html>
