<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Butterfly Animation</title>
    <style>
        body {
            background-color: #0b0f19;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .butterfly-container {
            position: absolute;
            top: 50%;
            left: -120px;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: flyPath 14s infinite ease-in-out;
        }

        .butterfly-3d {
            display: flex;
            perspective: 600px;
        }

        .wing {
            width: 50px;
            height: auto;
            display: block;
        }

        .left-wing {
            transform-origin: right center;
            animation: flapLeft 0.17s infinite alternate ease-in-out;
        }

        .right-wing {
            transform-origin: left center;
            animation: flapRight 0.17s infinite alternate ease-in-out;
        }

        @keyframes flapLeft {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(68deg); }
        }

        @keyframes flapRight {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-68deg); }
        }

        @keyframes flyPath {
            0% {
                transform: translate(0, 0) rotate(10deg);
            }
            25% {
                transform: translate(30vw, -25vh) rotate(-15deg);
            }
            50% {
                transform: translate(60vw, 15vh) rotate(25deg);
            }
            75% {
                transform: translate(85vw, -15vh) rotate(-10deg);
            }
            100% {
                transform: translate(110vw, 10vh) rotate(10deg);
            }
        }
    </style>
</head>
<body>

    <div class="butterfly-container">
        <div class="butterfly-3d">
            <img src="Left W.png" alt="Left Wing" class="wing left-wing">
            <img src="Right W.png" alt="Right Wing" class="wing right-wing">
        </div>
    </div>

</body>
</html>
