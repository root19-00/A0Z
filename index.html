<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nl.live - Background Audio</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #334155;
      max-width: 400px;
      width: 100%;
    }

    .btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: 0.2s;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📻 Radio 538 Live</h2>
    <p style="color: #94a3b8; margin-top: 10px; font-size: 0.9rem;">
      اضغط تشغيل، ثم اخرج من المتصفح أو اقفل الشاشة للتحقق من استمرار الصوت!
    </p>

    <button class="btn" id="playBtn" onclick="togglePlay()">▶️ تشغيل الإذاعة</button>
  </div>

  <script>
    // 🔴 رابط حقيقي ومباشر لإذاعة Radio 538
    const streamUrl = 'https://stream.radio538.nl/radio538/mp3';
    const radio = new Audio(streamUrl);
    let isPlaying = false;

    function togglePlay() {
      const btn = document.getElementById('playBtn');

      if (!isPlaying) {
        radio.play();
        btn.innerHTML = '⏸️ إيقاف مؤقت';
        btn.style.background = '#22c55e';
        isPlaying = true;

        // 👈 دعم التحكم عبر شاشة القفل في الآيفون (Lock Screen)
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Radio 538 Direct',
            artist: 'nl.live',
            album: 'البث المباشر'
          });
        }
      } else {
        radio.pause();
        btn.innerHTML = '▶️ تشغيل الإذاعة';
        btn.style.background = '#ef4444';
        isPlaying = false;
      }
    }
  </script>

</body>
</html>
