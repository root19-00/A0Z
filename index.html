<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>A∞Z | Structural Mirror</title>
    <style>
        body {
            background-color: #000000;
            color: #00ffcc;
            font-family: "Courier New", Courier, monospace;
            padding: 2em;
            margin: 0;
            overflow: hidden;
        }
        .line {
            margin-bottom: 0.8em;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            word-break: break-all;
        }
        .highlight {
            color: #ff0033;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="output"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://a0zai-56c3a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ua = navigator.userAgent;
        const platform = navigator.platform || "Unknown";
        const width = window.screen.width;
        const height = window.screen.height;
        const cores = navigator.hardwareConcurrency || "N/A";
        const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "N/A";
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const language = navigator.language || "N/A";

        const sessionId = btoa(ua + width + height).slice(0, 16);

        const telemetryData = {
            sessionId: sessionId,
            platform: platform,
            resolution: `${width}x${height}`,
            cores: cores,
            memory: memory,
            timezone: timezone,
            language: language,
            userAgent: ua,
            timestamp: new Date().toISOString()
        };

        const sessionsRef = ref(db, 'mirror_sessions/' + sessionId);
        set(sessionsRef, telemetryData).catch(() => {});

        const lines = [
            "<span class='highlight'>[ A∞ZAI Structural Mirror v3.0 ]</span>",
            "Establishing background handshake...",
            "----------------------------------------",
            "Session ID: " + sessionId,
            "Platform: " + platform,
            "Screen Resolution: " + width + "x" + height,
            "Hardware Cores: " + cores,
            "Estimated RAM: " + memory,
            "Timezone: " + timezone,
            "Status: <span class='highlight'>SYNCED TO CONTROL PANEL</span>",
            "----------------------------------------"
        ];

        const container = document.getElementById("output");
        lines.forEach((line, index) => {
            setTimeout(() => {
                const div = document.createElement("div");
                div.className = "line";
                div.innerHTML = line;
                container.appendChild(div);
            }, index * 300);
        });
    </script>
</body>
</html>
