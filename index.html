<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nl.live - Live Streams & Radio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    /* Header */
    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #ef4444;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* 🔴 Radio Top Section - Smalle horizontale balk bovenaan */
    .radio-section {
      max-width: 1200px;
      margin: 0 auto 25px auto;
    }

    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .radio-bar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .radio-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radio-icon {
      font-size: 1.5rem;
    }

    .radio-details h4 {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .radio-details p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .audio-badge {
      background-color: #22c55e;
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .radio-play-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .radio-play-btn:active {
      transform: scale(0.96);
    }

    /* 🎥 Video Streams Grid Section - Grid onder de radio */
    .grid-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #475569;
    }

    .card-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      background-color: #ef4444;
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .card-footer {
      padding: 10px 16px;
      color: #94a3b8;
      font-size: 0.8rem;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Responsive voor kleine mobiele schermen */
    @media (max-width: 480px) {
      .radio-details p {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <a href="#" class="logo">nl<span>.live</span></a>
      <p class="subtitle">Live webcams en radiostreams in Nederland</p>
    </div>
  </header>

  <!-- 📻 TOP SECTION: Radio Audio Balk -->
  <div class="radio-section">
    <div class="section-label">🎧 Live Radio (blijft afspelen op vergrendelscherm)</div>
    <div class="radio-bar">
      <div class="radio-info">
        <div class="radio-icon">📻</div>
        <div class="radio-details">
          <h4>NPO 3FM Direct <span class="audio-badge">LIVE AUDIO</span></h4>
          <p>Directe audiostream – blijft afspelen in de achtergrond en op je vergrendelscherm</p>
        </div>
      </div>
      <button class="radio-play-btn" id="radioBtn" onclick="toggleRadio()">▶️ Radio afspelen</button>
    </div>
  </div>

  <!-- 🎥 BOTTOM SECTION: Video Streams Grid -->
  <div class="grid-container">

    <!-- Card 1: Live Stream 1 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🎥 Live Stream #1</div>
        <span class="live-badge">🔴 LIVE</span>
      </div>
      <div class="video-container">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/DaG5JReOYEw?autoplay=1&mute=1" 
          title="Live Stream 1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="card-footer">
        <span>📍 Nederland</span>
      </div>
    </div>

    <!-- Card 2: Live Stream 2 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🎥 Live Stream #2</div>
        <span class="live-badge">🔴 LIVE</span>
      </div>
      <div class="video-container">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/Gd9d4q6WvUY?autoplay=1&mute=1" 
          title="Live Stream 2"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="card-footer">
        <span>📍 Nederland</span>
      </div>
    </div>

  </div>

  <script>
    // Radio Audio Player Logic
    const audioUrl = 'https://icecast.omroep.nl/3fm-bb-mp3';
    const radio = new Audio(audioUrl);
    let isPlaying = false;

    function toggleRadio() {
      const btn = document.getElementById('radioBtn');

      if (!isPlaying) {
        radio.play();
        btn.innerHTML = '⏸️ Pauzeren';
        btn.style.background = '#22c55e';
        isPlaying = true;

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'NPO 3FM Live',
            artist: 'nl.live',
            album: 'Live Radio'
          });
        }
      } else {
        radio.pause();
        btn.innerHTML = '▶️ Radio afspelen';
        btn.style.background = '#ef4444';
        isPlaying = false;
      }
    }
  </script>

</body>
</html>
