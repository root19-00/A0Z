<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #080812;
    font-family: monospace;
  }
  canvas {
    display: block;
  }
  .overlay {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: rgba(100, 255, 218, 0.8);
    font-size: 18px;
    letter-spacing: 6px;
    pointer-events: none;
    text-shadow: 0 0 15px rgba(100, 255, 218, 0.8);
  }
</style>
</head>
<body>

<canvas id="twins"></canvas>
<div class="overlay">QUANTUM ENTANGLEMENT</div>

<script>
const canvas = document.getElementById('twins');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let time = 0;

class EntangledParticle {
  constructor(x, y, color, mirror) {
    this.baseX = x;
    this.baseY = y;
    this.x = x;
    this.y = y;
    this.color = color;
    this.mirror = mirror; // -1 for mirrored behavior
    this.size = Math.random() * 4 + 2;
    this.phase = Math.random() * Math.PI * 2;
    this.orbRadius = Math.random() * 60 + 40;
    this.speed = Math.random() * 0.02 + 0.02;
    this.pulseOffset = Math.random() * Math.PI;
  }

  update(masterTime) {
    const t = masterTime * this.speed + this.phase;
    
    // Complex orbit pattern
    const offsetX = Math.cos(t) * this.orbRadius + Math.cos(t * 3) * 20;
    const offsetY = Math.sin(t * 1.5) * this.orbRadius * 0.6 + Math.cos(t * 4) * 10;

    this.x = this.baseX + (offsetX * this.mirror);
    this.y = this.baseY + offsetY;
    
    this.currentPulse = (Math.sin(masterTime * 3 + this.pulseOffset) + 1) / 2; // 0 to 1
  }

  draw() {
    // Particle Glow
    ctx.shadowBlur = this.size * 3 + this.currentPulse * 20;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size + this.currentPulse * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color.match(/\d+/g).join(',')}, ${0.6 + this.currentPulse * 0.4})`;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
  }
}

const cx = canvas.width / 2;
const cy = canvas.height / 2;

// Create Entangled Pair
const particle1 = new EntangledParticle(cx - 200, cy, '#64ffda', 1); // Teal
const particle2 = new EntangledParticle(cx + 200, cy, '#ff6482', -1); // Pink (Mirrored)

const warpLines = [];
for (let i = 0; i < 40; i++) {
  warpLines.push({
    offset: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.01 + 0.005,
    length: Math.random() * 60 + 40
  });
}

function animate() {
  // Trail effect
  ctx.fillStyle = 'rgba(8, 8, 18, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  time += 0.03;

  // Draw Entanglement Field / Tunnel
  ctx.beginPath();
  for (let i = 0; i < warpLines.length; i++) {
    const line = warpLines[i];
    const t = time * line.speed + line.offset;
    const startX = cx - 200 + Math.sin(t) * 30;
    const endX = cx + 200 + Math.sin(t) * 30;
    const y = cy + Math.cos(t) * 50;

    ctx.moveTo(startX, y);
    ctx.lineTo(endX, y);
  }
  ctx.strokeStyle = 'rgba(100, 255, 218, 0.06)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Update and Draw Particles
  particle1.update(time);
  particle2.update(time);
  particle1.draw();
  particle2.draw();

  // Draw Connection Beam (The bond)
  ctx.beginPath();
  ctx.moveTo(particle1.x, particle1.y);
  ctx.lineTo(particle2.x, particle2.y);
  const gradient = ctx.createLinearGradient(particle1.x, particle1.y, particle2.x, particle2.y);
  gradient.addColorStop(0, particle1.color);
  gradient.addColorStop(1, particle2.color);
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 3 + particle1.currentPulse * 5;
  ctx.globalAlpha = 0.3 + particle1.currentPulse * 0.4;
  ctx.stroke();
  ctx.globalAlpha = 1.0;

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
