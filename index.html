<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Piano Shooter Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a24 0%, #08080c 100%);
            position: relative;
            overflow: hidden;
        }
        .note-display {
            font-size: 5rem;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            margin-bottom: 10px;
            transition: transform 0.1s ease;
        }
        .instruction {
            color: #7a7a8c;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        /* Muzzle flash effect when shooting */
        .flash {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,255,204,0) 70%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s ease;
        }
        .flash.active {
            opacity: 1;
        }
        /* Controls Container (Arrows & Action) */
        .controls-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 15px 20px;
            background-color: #121218;
            border-top: 2px solid #22222e;
        }
        .btn {
            background-color: #1f1f2e;
            border: 2px solid #383852;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .arrow-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 1.6rem;
        }
        .shoot-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc, #008866);
            border-color: #55ffdd;
            color: #000;
            font-size: 2rem;
            box-shadow: 0 0 15px rgba(0,255,204,0.4);
        }
        .btn:active, .btn.active {
            transform: scale(0.92);
            filter: brightness(1.2);
        }
        .shoot-btn:active, .shoot-btn.active {
            background: linear-gradient(135deg, #ffffff, #00ffcc);
            box-shadow: 0 0 25px rgba(0,255,204,0.8);
        }
        /* Piano Keyboard */
        .piano {
            display: flex;
            height: 160px;
            width: 100%;
            background-color: #050507;
            border-top: 4px solid #22222e;
            padding: 4px;
            gap: 4px;
        }
        .key {
            flex: 1;
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border-radius: 0 0 8px 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
            transition: background 0.1s, border-top 0.1s;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }
        .key.selected {
            border-top: 6px solid #00ffcc;
            background: linear-gradient(to bottom, #f0ffff 0%, #c0f0e0 100%);
        }
        .key:active, .key.active {
            background: #00ffcc;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="screen">
        <div class="flash" id="flashEffect"></div>
        <div class="note-display" id="display">🎵</div>
        <div class="instruction">Use arrows to target, shoot button to play!</div>
    </div>

    <!-- On-screen Arrow Controls -->
    <div class="controls-container">
        <button class="btn arrow-btn" id="leftBtn">◀</button>
        <button class="btn shoot-btn" id="shootBtn">🎯</button>
        <button class="btn arrow-btn" id="rightBtn">▶</button>
    </div>

    <!-- Piano Keys -->
    <div class="piano" id="pianoKeys">
        <div class="key" data-note="C" data-freq="261.63">C</div>
        <div class="key" data-note="D" data-freq="293.66">D</div>
        <div class="key" data-note="E" data-freq="329.63">E</div>
        <div class="key" data-note="F" data-freq="349.23">F</div>
        <div class="key" data-note="G" data-freq="392.00">G</div>
        <div class="key" data-note="A" data-freq="440.00">A</div>
        <div class="key" data-note="B" data-freq="493.88">B</div>
    </div>

    <script>
        // Web Audio API Context Setup
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(frequency) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle'; // Smooth synthetic piano-like tone
            osc.frequency.value = frequency;
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.9);
        }

        const keys = document.querySelectorAll('.key');
        const display = document.getElementById('display');
        const flashEffect = document.getElementById('flashEffect');
        
        let currentIndex = 0;

        // Direct key touch / click interaction
        keys.forEach((key, index) => {
            const freq = parseFloat(key.getAttribute('data-freq'));
            const note = key.getAttribute('data-note');

            key.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                currentIndex = index;
                updateSelection();
                triggerKeyAction(index, freq, note);
            });
        });

        function triggerKeyAction(index, freq, note) {
            playSound(freq);
            display.textContent = note;
            
            // Pop animation on display
            display.style.transform = 'scale(1.2)';
            setTimeout(() => display.style.transform = 'scale(1)', 100);

            // Visual feedback on key
            keys[index].classList.add('active');
            setTimeout(() => keys[index].classList.remove('active'), 150);
        }

        // Arrow Controls Logic
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const shootBtn = document.getElementById('shootBtn');

        leftBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            currentIndex = (currentIndex - 1 + keys.length) % keys.length;
            updateSelection();
            leftBtn.classList.add('active');
        });
        leftBtn.addEventListener('pointerup', () => leftBtn.classList.remove('active'));

        rightBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            currentIndex = (currentIndex + 1) % keys.length;
            updateSelection();
            rightBtn.classList.add('active');
        });
        rightBtn.addEventListener('pointerup', () => rightBtn.classList.remove('active'));

        // Shoot Button Action (Fires the currently highlighted key)
        shootBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const activeKey = keys[currentIndex];
            const freq = parseFloat(activeKey.getAttribute('data-freq'));
            const note = activeKey.getAttribute('data-note');
            
            triggerKeyAction(currentIndex, freq, note);
            
            // Trigger visual muzzle flash
            flashEffect.classList.add('active');
            setTimeout(() => flashEffect.classList.remove('active'), 100);
            
            shootBtn.classList.add('active');
        });
        shootBtn.addEventListener('pointerup', () => shootBtn.classList.remove('active'));

        function updateSelection() {
            keys.forEach((k, i) => {
                if (i === currentIndex) {
                    k.classList.add('selected');
                } else {
                    k.classList.remove('selected');
                }
            });
        }

        // Initialize first selection highlight
        updateSelection();
    </script>
</body>
</html>
