<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>غرفة البيانو</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  touch-action:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090a0e;
  font-family:Arial,sans-serif;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
#top{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}
.panel{
  color:#fff;
  background:#10131bd9;
  border:1px solid #ffffff25;
  box-shadow:0 8px 30px #0008;
  backdrop-filter:blur(12px);
  padding:9px 14px;
  border-radius:15px;
  font-weight:bold;
  font-size:15px;
}
#message{
  position:fixed;
  top:67px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:white;
  background:#0c1018d9;
  border:1px solid #ffffff20;
  padding:9px 16px;
  border-radius:20px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}
#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:#ffffff12;
  border:2px solid #ffffff25;
  box-shadow:0 10px 35px #0008,inset 0 0 25px #ffffff08;
  z-index:10;
}
#stick{
  position:absolute;
  width:62px;
  height:62px;
  left:41px;
  top:41px;
  border-radius:50%;
  background:linear-gradient(#ffffff42,#ffffff18);
  border:2px solid #ffffff45;
  box-shadow:0 5px 18px #0008;
}
.actions{
  position:fixed;
  right:22px;
  bottom:27px;
  display:flex;
  gap:13px;
  z-index:10;
  align-items:flex-end;
}
.action{
  width:70px;
  height:70px;
  border-radius:50%;
  border:2px solid #ffffff30;
  background:#121722dd;
  color:white;
  font-size:25px;
  box-shadow:0 8px 25px #0009,inset 0 0 20px #ffffff08;
  display:flex;
  align-items:center;
  justify-content:center;
}
.action:active{
  transform:scale(.9);
  background:#26364c;
}
#interact{
  display:none;
  position:fixed;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);
  z-index:10;
  color:white;
  background:#152231ee;
  border:1px solid #7edcff55;
  border-radius:22px;
  padding:10px 18px;
  font-size:14px;
  font-weight:bold;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top">
  <div class="panel">❤️ <span id="hp">100</span></div>
  <div class="panel">🎹 غرفة البيانو</div>
</div>
<div id="message"></div>
<div id="joystick">
  <div id="stick"></div>
</div>
<div class="actions">
  <button class="action" id="hit">👊</button>
  <button class="action" id="run">⚡</button>
</div>
<div id="interact">🎹 اضغط هنا للعزف</div>
<script>
'use strict';
/* =========================================================
   CANVAS
========================================================= */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();
/* =========================================================
   WORLD
========================================================= */
const world={
  w:1800,
  h:1200
};
const player={
  x:900,
  y:850,
  vx:0,
  vy:0,
  angle:0,
  speed:230,
  runSpeed:330,
  attacking:0,
  walk:0
};
const camera={
  x:0,
  y:0
};
/* =========================================================
   PIANO
========================================================= */
const piano={
  x:900,
  y:450,
  w:720,
  h:240
};
/* =========================================================
   PARTICLES
========================================================= */
const particles=[];
function particle(x,y,color){
  particles.push({
    x:x,
    y:y,
    vx:(Math.random()-.5)*100,
    vy:(Math.random()-.5)*100,
    life:.5,
    color:color
  });
}
/* =========================================================
   INPUT
========================================================= */
let input={
  x:0,
  y:0,
  run:false
};
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyPointer=null;
function joystickMove(e){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  let dx=e.clientX-cx;
  let dy=e.clientY-cy;
  const max=43;
  const len=Math.hypot(dx,dy);
  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }
  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
  input.x=dx/max;
  input.y=dy/max;
}
joystick.addEventListener('pointerdown',e=>{
  joyPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  joystickMove(e);
});
joystick.addEventListener('pointermove',e=>{
  if(e.pointerId===joyPointer)
    joystickMove(e);
});
function resetJoy(){
  joyPointer=null;
  input.x=0;
  input.y=0;
  stick.style.transform='translate(0,0)';
}
joystick.addEventListener('pointerup',resetJoy);
joystick.addEventListener('pointercancel',resetJoy);
/* =========================================================
   ACTION BUTTONS
========================================================= */
document.getElementById('run')
.addEventListener('pointerdown',()=>{
  input.run=true;
});
document.getElementById('run')
.addEventListener('pointerup',()=>{
  input.run=false;
});
document.getElementById('run')
.addEventListener('pointercancel',()=>{
  input.run=false;
});
document.getElementById('hit')
.addEventListener('pointerdown',attack);
/* =========================================================
   ATTACK
========================================================= */
function attack(){
  if(player.attacking>0)return;
  player.attacking=.35;
  for(let i=0;i<12;i++){
    particle(
      player.x+Math.cos(player.angle)*45,
      player.y+Math.sin(player.angle)*45,
      '#bcefff'
    );
  }
  message('👊 ضربة!');
  if(distance(
    player.x,
    player.y,
    piano.x,
    piano.y
  )<230){
    message('🎹 طَق! البيانو اهتز');
    for(let i=0;i<15;i++){
      particle(
        piano.x+(Math.random()-.5)*300,
        piano.y+(Math.random()-.5)*80,
        '#9deaff'
      );
    }
  }
}
/* =========================================================
   MESSAGE
========================================================= */
let messageTimer=0;
function message(text){
  const el=document.getElementById('message');
  el.textContent=text;
  el.style.opacity=1;
  messageTimer=1.3;
}
/* =========================================================
   DISTANCE
========================================================= */
function distance(x1,y1,x2,y2){
  return Math.hypot(x2-x1,y2-y1);
}
/* =========================================================
   CAMERA
========================================================= */
function updateCamera(){
  const targetX=
    player.x-W/2;
  const targetY=
    player.y-H/2;
  camera.x+=(targetX-camera.x)*.08;
  camera.y+=(targetY-camera.y)*.08;
  camera.x=Math.max(
    0,
    Math.min(world.w-W,camera.x)
  );
  camera.y=Math.max(
    0,
    Math.min(world.h-H,camera.y)
  );
}
/* =========================================================
   ROOM
========================================================= */
function drawRoom(){
  ctx.fillStyle='#101217';
  ctx.fillRect(
    -camera.x,
    -camera.y,
    world.w,
    world.h
  );
  /* floor */
  let floor=ctx.createLinearGradient(
    0,-camera.y,
    0,world.h-camera.y
  );
  floor.addColorStop(0,'#3a3138');
  floor.addColorStop(1,'#17171d');
  ctx.fillStyle=floor;
  ctx.fillRect(
    -camera.x,
    -camera.y,
    world.w,
    world.h
  );
  /* floor tiles */
  ctx.strokeStyle='#ffffff0c';
  ctx.lineWidth=2;
  const tile=100;
  for(let x=0;x<world.w;x+=tile){
    ctx.beginPath();
    ctx.moveTo(x-camera.x,0-camera.y);
    ctx.lineTo(x-camera.x,world.h-camera.y);
    ctx.stroke();
  }
  for(let y=0;y<world.h;y+=tile){
    ctx.beginPath();
    ctx.moveTo(0-camera.x,y-camera.y);
    ctx.lineTo(world.w-camera.x,y-camera.y);
    ctx.stroke();
  }
  /* walls */
  drawWall(0,0,world.w,70);
  drawWall(0,0,70,world.h);
  drawWall(world.w-70,0,70,world.h);
  drawWall(0,world.h-70,world.w,70);
  /* back wall decoration */
  for(let x=150;x<world.w-100;x+=190){
    ctx.fillStyle='#ffffff08';
    ctx.fillRect(
      x-camera.x,
      85-camera.y,
      120,
      150
    );
  }
  /* carpet */
  ctx.save();
  ctx.fillStyle='#17121b';
  ctx.shadowBlur=30;
  ctx.shadowColor='#000';
  roundRect(
    260-camera.x,
    650-camera.y,
    1280,
    390,
    35
  );
  ctx.fill();
  ctx.restore();
  /* carpet pattern */
  ctx.strokeStyle='#ffffff0b';
  ctx.lineWidth=3;
  roundRect(
    290-camera.x,
    680-camera.y,
    1220,
    330,
    25
  );
  ctx.stroke();
}
/* =========================================================
   WALL
========================================================= */
function drawWall(x,y,w,h){
  let g=ctx.createLinearGradient(
    0,y-camera.y,
    0,y+h-camera.y
  );
  g.addColorStop(0,'#242029');
  g.addColorStop(1,'#17151c');
  ctx.fillStyle=g;
  ctx.fillRect(
    x-camera.x,
    y-camera.y,
    w,
    h
  );
  ctx.strokeStyle='#ffffff18';
  ctx.strokeRect(
    x-camera.x,
    y-camera.y,
    w,
    h
  );
}
/* =========================================================
   PIANO
========================================================= */
function drawPiano(){
  const x=piano.x-camera.x;
  const y=piano.y-camera.y;
  /* shadow */
  ctx.save();
  ctx.fillStyle='#0009';
  ctx.filter='blur(15px)';
  roundRect(
    x-piano.w/2+20,
    y-piano.h/2+25,
    piano.w,
    piano.h,
    25
  );
  ctx.fill();
  ctx.restore();
  /* legs */
  ctx.fillStyle='#08090c';
  ctx.fillRect(
    x-piano.w/2+45,
    y+50,
    35,
    110
  );
  ctx.fillRect(
    x+piano.w/2-80,
    y+50,
    35,
    110
  );
  /* piano body */
  let body=ctx.createLinearGradient(
    x,
    y-piano.h/2,
    x,
    y+piano.h/2
  );
  body.addColorStop(0,'#343a44');
  body.addColorStop(.4,'#151a21');
  body.addColorStop(1,'#07090c');
  ctx.fillStyle=body;
  roundRect(
    x-piano.w/2,
    y-piano.h/2,
    piano.w,
    piano.h,
    25
  );
  ctx.fill();
  ctx.strokeStyle='#78859455';
  ctx.lineWidth=3;
  roundRect(
    x-piano.w/2,
    y-piano.h/2,
    piano.w,
    piano.h,
    25
  );
  ctx.stroke();
  /* piano top */
  ctx.fillStyle='#222832';
  roundRect(
    x-piano.w/2+22,
    y-piano.h/2+20,
    piano.w-44,
    95,
    14
  );
  ctx.fill();
  /* music stand */
  ctx.fillStyle='#080a0d';
  roundRect(
    x-170,
    y-piano.h/2+30,
    340,
    50,
    8
  );
  ctx.fill();
  /* keys */
  const keyW=(piano.w-80)/24;
  for(let i=0;i<24;i++){
    const kx=
      x-piano.w/2+40+i*keyW;
    let keyGrad=ctx.createLinearGradient(
      0,
      y-35,
      0,
      y+40
    );
    keyGrad.addColorStop(0,'#ffffff');
    keyGrad.addColorStop(1,'#c8d0d8');
    ctx.fillStyle=keyGrad;
    ctx.fillRect(
      kx,
      y-35,
      keyW-2,
      75
    );
    ctx.strokeStyle='#69737e';
    ctx.strokeRect(
      kx,
      y-35,
      keyW-2,
      75
    );
  }
  /* black keys */
  const blackIndexes=[
    0,1,3,4,5,
    7,8,10,11,12,
    14,15,17,18,19,
    21,22
  ];
  blackIndexes.forEach(i=>{
    const kx=
      x-piano.w/2+40+
      (i+1)*keyW-
      keyW*.27;
    let bg=ctx.createLinearGradient(
      0,y-45,
      0,y+15
    );
    bg.addColorStop(0,'#343a42');
    bg.addColorStop(1,'#050609');
    ctx.fillStyle=bg;
    roundRect(
      kx,
      y-45,
      keyW*.55,
      55,
      5
    );
    ctx.fill();
  });
  /* piano light */
  const glow=ctx.createRadialGradient(
    x,
    y,
    20,
    x,
    y,
    500
  );
  glow.addColorStop(0,'#8edcff20');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(
    x-500,
    y-400,
    1000,
    800
  );
}
/* =========================================================
   PLAYER
========================================================= */
function drawPlayer(){
  const x=player.x-camera.x;
  const y=player.y-camera.y;
  const moving=
    Math.abs(player.vx)+Math.abs(player.vy)>15;
  const walk=Math.sin(player.walk)*5;
  /* shadow */
  ctx.save();
  ctx.fillStyle='#0008';
  ctx.filter='blur(8px)';
  ctx.beginPath();
  ctx.ellipse(
    x,
    y+35,
    27,
    11,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(player.angle);
  /* direction glow */
  ctx.fillStyle='#8bdfff18';
  ctx.beginPath();
  ctx.arc(0,0,55,0,Math.PI*2);
  ctx.fill();
  /* legs */
  ctx.save();
  ctx.translate(0,15);
  ctx.fillStyle='#10151d';
  roundRect(
    -18,
    -5+(moving?walk:0),
    14,
    42,
    6
  );
  ctx.fill();
  roundRect(
    4,
    -5-(moving?walk:0),
    14,
    42,
    6
  );
  ctx.fill();
  /* shoes */
  ctx.fillStyle='#07090d';
  roundRect(
    -22,
    30+(moving?walk:0),
    22,
    11,
    5
  );
  ctx.fill();
  roundRect(
    2,
    30-(moving?walk:0),
    22,
    11,
    5
  );
  ctx.fill();
  ctx.restore();
  /* body */
  let shirt=ctx.createLinearGradient(
    -25,-30,
    25,30
  );
  shirt.addColorStop(0,'#4b667c');
  shirt.addColorStop(.5,'#182632');
  shirt.addColorStop(1,'#080d13');
  ctx.fillStyle=shirt;
  roundRect(
    -27,
    -34,
    54,
    60,
    15
  );
  ctx.fill();
  ctx.strokeStyle='#8ab1c555';
  ctx.stroke();
  /* neck */
  ctx.fillStyle='#c58e6b';
  roundRect(
    -8,
    -45,
    16,
    14,
    5
  );
  ctx.fill();
  /* head */
  let skin=ctx.createLinearGradient(
    -20,-75,
    20,-40
  );
  skin.addColorStop(0,'#e0ac82');
  skin.addColorStop(1,'#8e5b45');
  ctx.fillStyle=skin;
  ctx.beginPath();
  ctx.arc(
    0,
    -58,
    20,
    0,
    Math.PI*2
  );
  ctx.fill();
  /* hair */
  ctx.fillStyle='#11151c';
  ctx.beginPath();
  ctx.arc(
    0,
    -63,
    21,
    Math.PI,
    Math.PI*2
  );
  ctx.fill();
  /* face */
  ctx.fillStyle='#15191e';
  ctx.beginPath();
  ctx.arc(
    8,
    -57,
    2.5,
    0,
    Math.PI*2
  );
  ctx.fill();
  /* arm */
  ctx.fillStyle='#18242f';
  const reach=
    player.attacking>0
    ? 48
    : 27;
  roundRect(
    15,
    -23,
    reach,
    12,
    6
  );
  ctx.fill();
  /* hand */
  ctx.fillStyle='#d4a078';
  ctx.beginPath();
  ctx.arc(
    15+reach,
    -17,
    7,
    0,
    Math.PI*2
  );
  ctx.fill();
  /* attack flash */
  if(player.attacking>0){
    ctx.strokeStyle='#b8f2ff';
    ctx.lineWidth=3;
    ctx.shadowBlur=20;
    ctx.shadowColor='#8deaff';
    ctx.beginPath();
    ctx.arc(
      reach+25,
      -17,
      15,
      0,
      Math.PI*2
    );
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.restore();
}
/* =========================================================
   LIGHTING
========================================================= */
function drawLighting(){
  /* room center */
  let g=ctx.createRadialGradient(
    900-camera.x,
    430-camera.y,
    40,
    900-camera.x,
    430-camera.y,
    850
  );
  g.addColorStop(0,'#fff1d82c');
  g.addColorStop(.35,'#d6b08b12');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;
  ctx.fillRect(
    -camera.x,
    -camera.y,
    world.w,
    world.h
  );
  /* window light */
  let w=ctx.createLinearGradient(
    250-camera.x,
    0,
    700-camera.x,
    500-camera.y
  );
  w.addColorStop(0,'#9edcff18');
  w.addColorStop(1,'transparent');
  ctx.fillStyle=w;
  ctx.fillRect(
    0-camera.x,
    0-camera.y,
    900,
    700
  );
  /* piano spotlight */
  g=ctx.createRadialGradient(
    piano.x-camera.x,
    piano.y-camera.y,
    20,
    piano.x-camera.x,
    piano.y-camera.y,
    450
  );
  g.addColorStop(0,'#d7f5ff20');
  g.addColorStop(.45,'#89d8ff09');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;
  ctx.fillRect(
    piano.x-camera.x-500,
    piano.y-camera.y-500,
    1000,
    1000
  );
}
/* =========================================================
   PARTICLES
========================================================= */
function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0){
      particles.splice(i,1);
      continue;
    }
    ctx.globalAlpha=p.life*2;
    ctx.fillStyle=p.color;
    ctx.shadowBlur=10;
    ctx.shadowColor=p.color;
    ctx.beginPath();
    ctx.arc(
      p.x-camera.x,
      p.y-camera.y,
      3,
      0,
      Math.PI*2
    );
    ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
/* =========================================================
   ROUND RECT
========================================================= */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );
  ctx.closePath();
}
/* =========================================================
   UPDATE
========================================================= */
function update(dt){
  /* message */
  if(messageTimer>0){
    messageTimer-=dt;
    if(messageTimer<=0)
      document.getElementById('message')
      .style.opacity=0;
  }
  /* movement */
  const len=Math.hypot(input.x,input.y);
  let speed=
    input.run
    ? player.runSpeed
    : player.speed;
  if(len>.05){
    const nx=input.x/Math.max(1,len);
    const ny=input.y/Math.max(1,len);
    player.vx+=(nx*speed-player.vx)*dt*10;
    player.vy+=(ny*speed-player.vy)*dt*10;
    player.angle=Math.atan2(ny,nx);
    player.walk+=dt*10;
  }else{
    player.vx*=Math.pow(.02,dt);
    player.vy*=Math.pow(.02,dt);
  }
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  /* room boundaries */
  player.x=Math.max(
    105,
    Math.min(world.w-105,player.x)
  );
  player.y=Math.max(
    115,
    Math.min(world.h-105,player.y)
  );
  /* piano collision */
  const dx=player.x-piano.x;
  const dy=player.y-piano.y;
  if(
    Math.abs(dx)<piano.w/2+35 &&
    Math.abs(dy)<piano.h/2+35
  ){
    if(Math.abs(dx)>Math.abs(dy)){
      player.x=
        piano.x+
        Math.sign(dx)*(piano.w/2+40);
    }else{
      player.y=
        piano.y+
        Math.sign(dy)*(piano.h/2+40);
    }
  }
  /* attack */
  if(player.attacking>0)
    player.attacking-=dt;
  /* camera */
  updateCamera();
  /* particles */
  drawParticles(dt);
  /* piano interaction */
  const near=
    distance(
      player.x,
      player.y,
      piano.x,
      piano.y
    )<310;
  const interact=
    document.getElementById('interact');
  interact.style.display=
    near?'block':'none';
}
/* =========================================================
   PIANO TOUCH
========================================================= */
document.getElementById('interact')
.addEventListener('pointerdown',playPiano);
function playPiano(){
  const notes=[
    261.63,
    293.66,
    329.63,
    349.23,
    392,
    440,
    493.88
  ];
  const note=
    notes[
      Math.floor(Math.random()*notes.length)
    ];
  try{
    const A=
      window.audio||
      (window.audio=
        new AudioContext()
      );
    const o=A.createOscillator();
    const g=A.createGain();
    o.type='sine';
    o.frequency.value=note;
    g.gain.setValueAtTime(
      .15,
      A.currentTime
    );
    g.gain.exponentialRampToValueAtTime(
      .001,
      A.currentTime+.8
    );
    o.connect(g).connect(A.destination);
    o.start();
    o.stop(A.currentTime+.8);
  }catch(e){}
  message('🎹 نغمة جميلة!');
  for(let i=0;i<8;i++){
    particle(
      piano.x+(Math.random()-.5)*400,
      piano.y-70-Math.random()*50,
      '#b8edff'
    );
  }
}
/* =========================================================
   DRAW
========================================================= */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  drawRoom();
  drawPiano();
  drawLighting();
  drawParticles(0);
  drawPlayer();
  ctx.restore();
}
/* =========================================================
   GAME LOOP
========================================================= */
let last=performance.now();
function loop(now){
  const dt=
    Math.min(.033,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* =========================================================
   PREVENT MOBILE SCROLL / ZOOM
========================================================= */
document.addEventListener(
  'gesturestart',
  e=>e.preventDefault()
);
document.addEventListener(
  'contextmenu',
  e=>e.preventDefault()
);
</script>
