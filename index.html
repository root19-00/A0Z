<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لعبة البيانو</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#09070c;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
#ui{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  color:white;
  font:bold 18px Arial;
  pointer-events:none;
}
.box{
  padding:10px 16px;
  border-radius:15px;
  background:#090b12cc;
  border:1px solid #ffffff30;
  box-shadow:0 8px 30px #0008;
  backdrop-filter:blur(10px);
}
#hint{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font:15px Arial;
  background:#090b12dd;
  padding:10px 17px;
  border-radius:22px;
  white-space:nowrap;
  border:1px solid #ffffff25;
  box-shadow:0 5px 25px #0008;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="box">❤️ <span id="hp">100</span></div>
  <div class="box" id="msg">جاهز</div>
</div>
<div id="hint">
  الأسهم / WASD للحركة · Space أو Z للكمة · X للرمي
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){
  W=innerWidth;
  H=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();
/* =========================
   CONTROLS
========================= */
const K={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  K[k]=true;
  if([
    'arrowup','arrowdown',
    'arrowleft','arrowright',
    ' ','z','x'
  ].includes(k)) e.preventDefault();
  if(!e.repeat && (k===' ' || k==='z')) punch();
  if(!e.repeat && k==='x') throwItem();
});
addEventListener('keyup',e=>{
  K[e.key.toLowerCase()]=false;
});
/* =========================
   PLAYER
========================= */
const P={
  x:0,
  y:145,
  vx:0,
  vy:0,
  dir:1,
  punch:0,
  throwAnim:0
};
const balls=[];
const sparks=[];
const dust=[];
let shake=0;
let last=performance.now();
/* =========================
   COORDINATES
========================= */
function S(x,y){
  return {
    x:W/2+x*1.02,
    y:H*.32+y*.72
  };
}
/* =========================
   HELPERS
========================= */
function rr(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill){
    ctx.fillStyle=fill;
    ctx.fill();
  }
  if(stroke){
    ctx.strokeStyle=stroke;
    ctx.stroke();
  }
}
function glowCircle(x,y,r,color,blur){
  ctx.save();
  ctx.shadowBlur=blur;
  ctx.shadowColor=color;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
/* =========================
   BACKGROUND
========================= */
function background(){
  /* dark background */
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#09070d');
  g.addColorStop(.35,'#211522');
  g.addColorStop(1,'#07070b');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  /* warm upper wall */
  g=ctx.createLinearGradient(0,0,0,H*.42);
  g.addColorStop(0,'#17101a');
  g.addColorStop(.55,'#43282d');
  g.addColorStop(1,'#a36a51');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H*.42);
  /* brick wall */
  ctx.lineWidth=1.5;
  ctx.strokeStyle='#d38b7020';
  for(let y=25;y<H*.34;y+=42){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
    for(let x=-100;x<W+100;x+=105){
      const off=(Math.floor(y/42)%2)*52;
      ctx.beginPath();
      ctx.moveTo(x+off,y-42);
      ctx.lineTo(x+off,y);
      ctx.stroke();
    }
  }
  /* stage floor */
  g=ctx.createLinearGradient(0,H*.34,0,H);
  g.addColorStop(0,'#493a48');
  g.addColorStop(.45,'#201d27');
  g.addColorStop(1,'#08080c');
  ctx.fillStyle=g;
  ctx.fillRect(0,H*.34,W,H*.66);
  /* floor lines */
  ctx.strokeStyle='#ffffff08';
  ctx.lineWidth=2;
  for(let i=-8;i<=8;i++){
    ctx.beginPath();
    ctx.moveTo(W/2+i*75,H*.42);
    ctx.lineTo(W/2+i*190,H);
    ctx.stroke();
  }
  /* floor reflection */
  let rg=ctx.createRadialGradient(
    W/2,H*.52,
    10,
    W/2,H*.52,
    W*.65
  );
  rg.addColorStop(0,'#ffffff15');
  rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg;
  ctx.fillRect(0,H*.34,W,H*.66);
}
/* =========================
   STAGE LIGHTS
========================= */
function lights(){
  ctx.save();
  /* left spotlight */
  let g=ctx.createRadialGradient(
    W*.23,H*.12,5,
    W*.5,H*.45,W*.55
  );
  g.addColorStop(0,'#ffd9a044');
  g.addColorStop(.35,'#ff9f4520');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  /* right blue spotlight */
  g=ctx.createRadialGradient(
    W*.8,H*.15,5,
    W*.55,H*.45,W*.55
  );
  g.addColorStop(0,'#7bdcff35');
  g.addColorStop(.4,'#477dff18');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  /* center spotlight */
  g=ctx.createRadialGradient(
    W/2,H*.38,10,
    W/2,H*.48,W*.45
  );
  g.addColorStop(0,'#fff6dd20');
  g.addColorStop(.5,'#fff0d00b');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}
/* =========================
   PIANO
========================= */
function piano(){
  const a=S(-315,0);
  const b=S(315,0);
  const c1=S(245,440);
  const d=S(-245,440);
  /* piano shadow */
  ctx.save();
  ctx.filter='blur(18px)';
  ctx.fillStyle='#00000099';
  ctx.beginPath();
  ctx.moveTo(a.x+15,a.y+15);
  ctx.lineTo(b.x+15,b.y+15);
  ctx.lineTo(c1.x+20,c1.y+20);
  ctx.lineTo(d.x+20,d.y+20);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  /* main piano */
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.lineTo(c1.x,c1.y);
  ctx.lineTo(d.x,d.y);
  ctx.closePath();
  let g=ctx.createLinearGradient(
    W/2,H*.33,
    W/2,H
  );
  g.addColorStop(0,'#ffffff');
  g.addColorStop(.25,'#f0fbff');
  g.addColorStop(.65,'#d2e7ef');
  g.addColorStop(1,'#759aaa');
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle='#ffffffcc';
  ctx.lineWidth=4;
  ctx.stroke();
  /* piano glow */
  ctx.save();
  ctx.shadowBlur=28;
  ctx.shadowColor='#9beaff55';
  ctx.strokeStyle='#d8faffaa';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
  ctx.restore();
  /* white keys */
  for(let i=-5;i<=5;i++){
    const p1=S(i*52,20);
    const p2=S(i*52,430);
    ctx.strokeStyle='#526f7c55';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.stroke();
  }
  /* black keys */
  for(let i=-4;i<=4;i++){
    let x=i*70+25;
    let p1=S(x,25);
    let p2=S(x+20,25);
    let p3=S(x+18,100);
    let p4=S(x-2,100);
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.lineTo(p3.x,p3.y);
    ctx.lineTo(p4.x,p4.y);
    ctx.closePath();
    let kg=ctx.createLinearGradient(
      p1.x,p1.y,
      p3.x,p3.y
    );
    kg.addColorStop(0,'#343b46');
    kg.addColorStop(.5,'#11151b');
    kg.addColorStop(1,'#05070a');
    ctx.fillStyle=kg;
    ctx.fill();
    ctx.strokeStyle='#ffffff18';
    ctx.stroke();
  }
  /* target */
  let t=S(0,330);
  ctx.save();
  ctx.shadowBlur=25;
  ctx.shadowColor='#8eeaff66';
  rr(
    t.x-61,
    t.y-37,
    122,
    74,
    10,
    '#effaff',
    '#26343d'
  );
  ctx.restore();
  /* target ring */
  ctx.strokeStyle='#68dfff';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(t.x,t.y,20,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle='#17232c';
  ctx.beginPath();
  ctx.arc(t.x,t.y,7,0,Math.PI*2);
  ctx.fill();
  /* piano edge highlight */
  ctx.strokeStyle='#ffffff80';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(d.x,d.y);
  ctx.lineTo(c1.x,c1.y);
  ctx.stroke();
}
/* =========================
   PLAYER
========================= */
function player(){
  const p=S(P.x,P.y);
  const bob=Math.sin(performance.now()/95)*1.5;
  ctx.save();
  ctx.translate(p.x,p.y+bob);
  if(P.dir<0) ctx.scale(-1,1);
  /* shadow */
  ctx.save();
  ctx.globalAlpha=.45;
  ctx.filter='blur(5px)';
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(0,62,35,11,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  /* blue rim light */
  ctx.save();
  ctx.globalAlpha=.35;
  ctx.shadowBlur=22;
  ctx.shadowColor='#54dfff';
  ctx.strokeStyle='#54dfff';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(0,-55,23,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
  /* legs */
  rr(-22,12,17,49,7,'#111a25','#405466');
  rr(5,12,17,49,7,'#111a25','#405466');
  /* shoes */
  rr(-27,53,25,11,5,'#06090d','#253440');
  rr(2,53,25,11,5,'#06090d','#253440');
  /* body */
  let bodyGrad=ctx.createLinearGradient(
    -30,-40,
    30,25
  );
  bodyGrad.addColorStop(0,'#26394a');
  bodyGrad.addColorStop(.5,'#111c28');
  bodyGrad.addColorStop(1,'#080e15');
  rr(
    -32,-43,
    64,66,
    15,
    bodyGrad,
    '#435d70'
  );
  /* jacket center */
  ctx.strokeStyle='#657d8e55';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0,-38);
  ctx.lineTo(0,20);
  ctx.stroke();
  /* neck */
  rr(-9,-49,18,12,5,'#c89b73');
  /* head */
  let skin=ctx.createLinearGradient(
    -20,-78,
    18,-40
  );
  skin.addColorStop(0,'#e0b184');
  skin.addColorStop(1,'#9a6549');
  ctx.fillStyle=skin;
  ctx.beginPath();
  ctx.arc(0,-59,21,0,Math.PI*2);
  ctx.fill();
  /* hair */
  let hair=ctx.createLinearGradient(
    -20,-82,
    20,-55
  );
  hair.addColorStop(0,'#202630');
  hair.addColorStop(1,'#080b10');
  ctx.fillStyle=hair;
  ctx.beginPath();
  ctx.arc(-1,-65,22,Math.PI,Math.PI*2);
  ctx.lineTo(19,-57);
  ctx.quadraticCurveTo(10,-76,-5,-78);
  ctx.quadraticCurveTo(-17,-75,-20,-59);
  ctx.closePath();
  ctx.fill();
  /* face light */
  ctx.fillStyle='#f0c59a';
  ctx.beginPath();
  ctx.arc(8,-57,3,0,Math.PI*2);
  ctx.fill();
  /* punching arm */
  const punching=P.punch>0;
  ctx.save();
  if(punching){
    const amount=
      Math.sin((P.punch/.23)*Math.PI)*35;
    ctx.translate(amount,0);
  }
  rr(
    17,-30,
    punching?55:43,
    14,
    7,
    '#111a25',
    '#405668'
  );
  ctx.fillStyle='#d6aa80';
  ctx.beginPath();
  ctx.arc(
    punching?74:58,
    -23,
    8,
    0,
    Math.PI*2
  );
  ctx.fill();
  ctx.restore();
  /* back arm */
  rr(
    -56,-22,
    35,
    13,
    7,
    '#111a25',
    '#405668'
  );
  /* punch glow */
  if(punching){
    ctx.save();
    ctx.globalAlpha=.7;
    ctx.shadowBlur=25;
    ctx.shadowColor='#b5f4ff';
    ctx.strokeStyle='#c8f8ff';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(75,-23,14,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
/* =========================
   PARTICLES
========================= */
function drawDust(){
  dust.forEach(d=>{
    const p=S(d.x,d.y);
    ctx.globalAlpha=Math.max(0,d.t);
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(p.x,p.y,d.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}
/* =========================
   ACTIONS
========================= */
function punch(){
  if(P.punch>0) return;
  P.punch=.23;
  shake=6;
  beep(120,.08,'square',.14);
  say('لكمة!');
  for(let i=0;i<14;i++){
    sparks.push({
      x:P.x+P.dir*65,
      y:P.y-22,
      vx:P.dir*(80+Math.random()*180),
      vy:(Math.random()-.5)*150,
      t:.4+Math.random()*.2
    });
  }
}
function throwItem(){
  if(P.punch>0) return;
  beep(260,.08,'triangle',.1);
  say('رمي!');
  balls.push({
    x:P.x+P.dir*35,
    y:P.y-28,
    vx:P.dir*390,
    vy:-100,
    t:2
  });
}
/* =========================
   AUDIO
========================= */
function beep(f,d,type,gain){
  try{
    let A=window.A||(window.A=
      new (window.AudioContext||window.webkitAudioContext)()
    );
    let o=A.createOscillator();
    let g=A.createGain();
    o.type=type;
    o.frequency.value=f;
    g.gain.setValueAtTime(
      gain,
      A.currentTime
    );
    g.gain.exponentialRampToValueAtTime(
      .001,
      A.currentTime+d
    );
    o.connect(g).connect(A.destination);
    o.start();
    o.stop(A.currentTime+d);
  }catch(e){}
}
/* =========================
   MESSAGE
========================= */
function say(x){
  const msg=document.getElementById('msg');
  msg.textContent=x;
  clearTimeout(window.st);
  window.st=setTimeout(()=>{
    msg.textContent='جاهز';
  },450);
}
/* =========================
   UPDATE
========================= */
function update(dt){
  let ax=
    (K.arrowright||K.d?1:0)-
    (K.arrowleft||K.a?1:0);
  let ay=
    (K.arrowdown||K.s?1:0)-
    (K.arrowup||K.w?1:0);
  let targetX=ax*185;
  let targetY=ay*120;
  P.vx+=(targetX-P.vx)*
    Math.min(1,dt*9);
  P.vy+=(targetY-P.vy)*
    Math.min(1,dt*9);
  P.x+=P.vx*dt;
  P.y+=P.vy*dt;
  P.x=Math.max(-235,Math.min(235,P.x));
  P.y=Math.max(45,Math.min(370,P.y));
  if(Math.abs(P.vx)>5)
    P.dir=P.vx>0?1:-1;
  P.punch=Math.max(
    0,
    P.punch-dt
  );
  /* balls */
  balls.forEach(b=>{
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.vy+=250*dt;
    b.t-=dt;
  });
  for(let i=balls.length-1;i>=0;i--){
    let b=balls[i];
    if(
      b.y>320 &&
      b.x>-180 &&
      b.x<180
    ){
      beep(130,.1,'sine',.08);
      shake=4;
      for(let j=0;j<16;j++){
        sparks.push({
          x:b.x,
          y:b.y,
          vx:(Math.random()-.5)*190,
          vy:-Math.random()*190,
          t:.45
        });
      }
      balls.splice(i,1);
    }else if(b.t<0){
      balls.splice(i,1);
    }
  }
  /* sparks */
  sparks.forEach(s=>{
    s.x+=s.vx*dt;
    s.y+=s.vy*dt;
    s.vy+=200*dt;
    s.t-=dt;
  });
  for(let i=sparks.length-1;i>=0;i--){
    if(sparks[i].t<=0)
      sparks.splice(i,1);
  }
  /* dust */
  if(
    Math.abs(P.vx)>30 ||
    Math.abs(P.vy)>30
  ){
    if(Math.random()<.3){
      dust.push({
        x:P.x+(Math.random()-.5)*30,
        y:P.y+55,
        size:1+Math.random()*3,
        t:.5
      });
    }
  }
  dust.forEach(d=>{
    d.y-=dt*12;
    d.t-=dt;
  });
  for(let i=dust.length-1;i>=0;i--){
    if(dust[i].t<=0)
      dust.splice(i,1);
  }
  shake*=Math.pow(.02,dt);
}
/* =========================
   DRAW
========================= */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(
    (Math.random()-.5)*shake,
    (Math.random()-.5)*shake
  );
  background();
  lights();
  piano();
  /* thrown balls */
  balls.forEach(b=>{
    const p=S(b.x,b.y);
    ctx.save();
    ctx.shadowBlur=25;
    ctx.shadowColor='#7deaff';
    let bg=ctx.createRadialGradient(
      p.x-3,p.y-4,1,
      p.x,p.y,12
    );
    bg.addColorStop(0,'#ffffff');
    bg.addColorStop(.4,'#b9f5ff');
    bg.addColorStop(1,'#4dc9ee');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.arc(p.x,p.y,10,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
  drawDust();
  /* sparks */
  sparks.forEach(s=>{
    const p=S(s.x,s.y);
    ctx.globalAlpha=
      Math.min(1,s.t*3);
    ctx.fillStyle='#c9f7ff';
    ctx.shadowBlur=12;
    ctx.shadowColor='#8deaff';
    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      2.5,
      0,
      Math.PI*2
    );
    ctx.fill();
    ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;
  player();
  ctx.restore();
}
/* =========================
   LOOP
========================= */
function loop(t){
  let dt=Math.min(
    .033,
    (t-last)/1000
  );
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
