<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nl.live - Radio 538 Studio Cam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #ef4444;
    }

    .tagline {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Stream Card Container */
    .stream-card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .stream-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .station-title {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      background-color: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      animation: pulse 2s infinite;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: white;
      border-radius: 50%;
    }

    /* Video Player Wrapper (16:9 Responsive) */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .stream-footer {
      padding: 15px 20px;
      color: #94a3b8;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">nl<span>.live</span></a>
    <p class="tagline">Live uit de studio in Nederland</p>
  </header>

  <div class="stream-card">
    <div class="stream-header">
      <div class="station-title">
        📻 Radio 538 Studio Cam
      </div>
      <div class="live-badge">
        <span class="live-dot"></span> LIVE
      </div>
    </div>

    <!-- Embedded Studio Live Stream -->
    <div class="video-container">
      <iframe 
  src="https://www.youtube.com/embed/_wYENnYaboM?autoplay=1" 
  title="Live Radio Stream" 
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
  allowfullscreen>
</iframe>
    </div>

    <div class="stream-footer">
      <span>📍 Hilversum, Nederland</span>
      <span>🔊 Klik op de video voor geluid</span>
    </div>
  </div>

</body>
</html>
