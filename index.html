<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flat Piano Arena</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#08080d;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #hud{
    position:fixed;inset:16px 16px auto 16px;display:flex;justify-content:space-between;
    pointer-events:none;color:#fff;text-shadow:0 2px 8px #000;font-weight:700
  }
  .panel{background:rgba(10,12,20,.48);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px}
  #help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    color:#fff;background:rgba(8,10,18,.68);border:1px solid rgba(255,255,255,.15);
    padding:9px 16px;border-radius:999px;backdrop-filter:blur(10px);font-size:14px}
  b{color:#8de7ff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel">❤️ <span id="hp">100</span></div>
  <div class="panel">⚡ <span id="status">جاهز</span></div>
</div>
<div id="help">الأسهم للحركة · <b>Space / Z</b> لكم · <b>X</b> رمي</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize); resize();

const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','z','x'].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.repeat) return;
  if(e.key===' '||e.key.toLowerCase()==='z') punch();
  if(e.key.toLowerCase()==='x') throwBall();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const player={x:0,y:115,vx:0,vy:0,face:1,punch:0,throwing:0};
const balls=[];
const particles=[];
let hp=100,last=performance.now(),shake=0,flash=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function screen(p){
  // pseudo 3D: world x/y -> screen
  const cx=W/2, horizon=H*.33, sx=1.02, sy=.70;
  return {x:cx+p.x*sx, y:horizon+p.y*sy};
}
function piano(){
  const cx=W/2, top=H*.33;
  // floor glow
  const g=ctx.createRadialGradient(cx,H*.62,20,cx,H*.62,Math.max(W,H)*.55);
  g.addColorStop(0,'rgba(43,117,145,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,top,W,H-top);

  // back wall
  const wall=ctx.createLinearGradient(0,0,0,top);
  wall.addColorStop(0,'#241c25');wall.addColorStop(1,'#6a443d');
  ctx.fillStyle=wall;ctx.fillRect(0,0,W,top+6);
  for(let y=36;y<top;y+=45){
    ctx.strokeStyle='rgba(20,10,16,.42)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+4);ctx.stroke();
  }

  // floor
  const floor=ctx.createLinearGradient(0,top,0,H);
  floor.addColorStop(0,'#332b39');floor.addColorStop(1,'#0d0d13');
  ctx.fillStyle=floor;ctx.fillRect(0,top,W,H-top);

  // flat piano perspective polygon
  const pts=[[-310,0],[310,0],[235,455],[-235,455]].map(([x,y])=>screen({x,y}));
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
  const pg=ctx.createLinearGradient(cx,top,cx,H);
  pg.addColorStop(0,'#f7fbff');pg.addColorStop(.55,'#dce8f1');pg.addColorStop(1,'#a7c7d6');
  ctx.fillStyle=pg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=3;ctx.stroke();

  // piano keys / seams
  for(let i=-4;i<=4;i++){
    const x=i*55;
    const a=screen({x,y:8}), b=screen({x*0.76,y:425});
    ctx.strokeStyle='rgba(50,85,100,.20)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // black keys
  for(let i=-3;i<=3;i++){
    const x=i*70+25;
    const a=screen({x,y:30}), b=screen({x:x-3,y:105});
    const q=screen({x:x+20,y:105}), d=screen({x:x+23,y:30});
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(d.x,d.y);ctx.lineTo(q.x,q.y);ctx.lineTo(b.x,b.y);ctx.closePath();
    ctx.fillStyle='rgba(35,40,49,.78)';ctx.fill();
  }
  // center target
  const t=screen({x:0,y:315});
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(-.04);
  ctx.fillStyle='rgba(18,28,36,.82)';roundRect(-58,-34,116,68,8);ctx.fill();
  ctx.fillStyle='#eef8ff';roundRect(-48,-24,96,48,6);ctx.fill();
  ctx.fillStyle='#1a2229';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('●',0,0);
  ctx.restore();
}
function shadow(x,y,w=42){
  const p=screen({x,y:y+28});ctx.save();ctx.globalAlpha=.28;
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(p.x,p.y,w,10,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawPlayer(){
  const p=screen(player), bob=Math.sin(performance.now()/90)*2;
  shadow(player.x,player.y,28);
  ctx.save();ctx.translate(p.x,p.y+bob);
  if(player.face<0)ctx.scale(-1,1);
  // backpack
  ctx.fillStyle='#16202b';roundRect(-35,-52,28,58,12);ctx.fill();
  ctx.fillStyle='#27394a';roundRect(-31,-46,20,48,9);ctx.fill();
  // legs
  ctx.fillStyle='#11151c';roundRect(-17,15,14,46,6);ctx.fill();roundRect(4,15,14,46,6);ctx.fill();
  // boots
  ctx.fillStyle='#090b10';roundRect(-21,53,20,10,5);ctx.fill();roundRect(2,53,20,10,5);ctx.fill();
  // body
  const body=ctx.createLinearGradient(-25,-30,25,25);body.addColorStop(0,'#1e2936');body.addColorStop(1,'#090d13');
  ctx.fillStyle=body;roundRect(-27,-38,54,62,14);ctx.fill();
  // head + hood
  ctx.fillStyle='#12161d';ctx.beginPath();ctx.arc(0,-55,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222a35';ctx.beginPath();ctx.arc(-2,-59,22,Math.PI,Math.PI*2);ctx.fill();
  // arm
  let arm=player.punch>0 ? 30 : 0;
  ctx.save();ctx.rotate((arm*Math.PI/180));
  ctx.fillStyle='#151c25';roundRect(15,-28,42,14,7);ctx.fill();
  ctx.fillStyle='#d0a57d';ctx.beginPath();ctx.arc(56,-21,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // other arm
  ctx.fillStyle='#151c25';roundRect(-55,-22,35,13,7);ctx.fill();
  ctx.restore();
}
function punch(){
  if(player.punch>0) return;
  player.punch=.22; shake=7; flash=.09; status('لكمة!');
  beep(95,.055,'square',.13);
  for(let i=0;i<10;i++) particles.push({x:player.x+player.face*45,y:player.y-15,vx:player.face*(70+Math.random()*90),vy:(Math.random()-.5)*100,life:.35});
}
function throwBall(){
  if(player.throwing>0) return;
  player.throwing=.28; status('رمي!');
  beep(210,.08,'triangle',.10);
  balls.push({x:player.x+player.face*30,y:player.y-25,vx:player.face*370,vy:-80,life:2});
}
function beep(freq,dur,type,gain){
  try{
    const ac=window.__ac||(window.__ac=new (AudioContext||webkitAudioContext)());
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(gain,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
function status(s){document.getElementById('status').textContent=s;setTimeout(()=>document.getElementById('status').textContent='جاهز',500)}
function update(dt){
  let ax=0,ay=0;
  if(keys.arrowleft||keys.a)ax-=1;if(keys.arrowright||keys.d)ax+=1;
  if(keys.arrowup||keys.w)ay-=1;if(keys.arrowdown||keys.s)ay+=1;
  const speed=180;
  player.vx=lerp(player.vx,ax*speed,1-Math.pow(.001,dt));
  player.vy=lerp(player.vy,ay*speed*.62,1-Math.pow(.001,dt));
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.x=clamp(player.x,-230,230);player.y=clamp(player.y,35,355);
  if(Math.abs(player.vx)>5)player.face=player.vx>0?1:-1;
  player.punch=Math.max(0,player.punch-dt);player.throwing=Math.max(0,player.throwing-dt);
  balls.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=230*dt;b.life-=dt});
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    if(b.y>320 && b.x>-170 && b.x<170){ // piano hit
      shake=4; beep(120,.09,'sine',.08);
      for(let k=0;k<14;k++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*130,vy:-Math.random()*160,life:.5});
      balls.splice(i,1);
    } else if(b.life<=0)balls.splice(i,1);
  }
  particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt;q.life-=dt});
  for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
  shake*=Math.pow(.02,dt);flash=Math.max(0,flash-dt);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.save();ctx.translate(sx,sy);
  piano();
  // balls
  balls.forEach(b=>{const p=screen(b);ctx.fillStyle='#e9fbff';ctx.shadowBlur=16;ctx.shadowColor='#74dcff';ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
  // particles
  particles.forEach(q=>{const p=screen(q);ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle='#b9f4ff';ctx.beginPath();ctx.arc(p.x,p.y,3+q.life*4,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
  drawPlayer();
  ctx.restore();
  if(flash){ctx.fillStyle=`rgba(255,255,255,${flash*2})`;ctx.fillRect(0,0,W,H)}
  document.getElementById('hp').textContent=hp;
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
loop(performance.now());

// Touch controls: swipe/virtual buttons for phones
let touchStart=null;
addEventListener('touchstart',e=>{
  const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY};
  if(t.clientX>W*.72 && t.clientY>H*.72) punch();
},{passive:true});
addEventListener('touchmove',e=>{
  if(!touchStart)return;const t=e.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
  keys.arrowleft=dx<-25;keys.arrowright=dx>25;keys.arrowup=dy<-25;keys.arrowdown=dy>25;
},{passive:true});
addEventListener('touchend',()=>{for(const k of ['arrowleft','arrowright','arrowup','arrowdown'])keys[k]=false;touchStart=null});
</script>
</body>
</html>
