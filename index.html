<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Pong // Arena</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05050f;
    font-family: monospace;
    color: #00f2fe;
    text-align: center;
  }
  canvas {
    display: block;
    background: #08081a;
    box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
    margin: 20px auto;
    border: 1px solid #2a2a50;
  }
  .score {
    font-size: 24px;
    letter-spacing: 4px;
    margin-top: 10px;
    text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
  }
  .hint {
    font-size: 12px;
    color: #7928ca;
    margin-top: 5px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="score" id="scoreboard">PLAYER: 0 // QUANTUM AI: 0</div>
<div class="hint">USE MOUSE TO MOVE PADDLE // 1+1=3 MODE ACTIVE</div>
<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreboard = document.getElementById('scoreboard');

let playerScore = 0;
let aiScore = 0;

// Game Objects
const player = { x: 20, y: 175, width: 12, height: 80, dy: 0 };
const ai = { x: 768, y: 175, width: 12, height: 80, speed: 4.5 };
const ball = { x: 400, y: 225, radius: 8, speedX: 5, speedY: 3, color: '#00f2fe' };

// Mouse tracking for player
window.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const rootPos = e.clientY - rect.top;
  player.y = rootPos - player.height / 2;
  // Boundaries
  if (player.y < 0) player.y = 0;
  if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
});

function resetBall() {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  ball.speedX = -ball.speedX;
  ball.speedY = (Math.random() - 0.5) * 6;
}

function update() {
  // Move Ball
  ball.x += ball.speedX;
  ball.y += ball.speedY;

  // Wall collision (Top / Bottom)
  if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
    ball.speedY = -ball.speedY;
  }

  // AI Movement (Simple tracking with slight lag)
  if (ai.y + ai.height / 2 < ball.y - 10) {
    ai.y += ai.speed;
  } else if (ai.y + ai.height / 2 > ball.y + 10) {
    ai.y -= ai.speed;
  }
  if (ai.y < 0) ai.y = 0;
  if (ai.y > canvas.height - ai.height) ai.y = canvas.height - ai.height;

  // Player Paddle Collision
  if (
    ball.x - ball.radius < player.x + player.width &&
    ball.y > player.y &&
    ball.y < player.y + player.height
  ) {
    ball.speedX = -ball.speedX * 1.05; // Quantum acceleration
    let deltaY = ball.y - (player.y + player.height / 2);
    ball.speedY = deltaY * 0.2;
    ball.color = '#00f2fe';
  }

  // AI Paddle Collision
  if (
    ball.x + ball.radius > ai.x &&
    ball.y > ai.y &&
    ball.y < ai.y + ai.height
  ) {
    ball.speedX = -ball.speedX * 1.05;
    let deltaY = ball.y - (ai.y + ai.height / 2);
    ball.speedY = deltaY * 0.2;
    ball.color = '#ff6482';
  }

  // Scoring
  if (ball.x < 0) {
    aiScore++;
    updateScoreboard();
    resetBall();
  } else if (ball.x > canvas.width) {
    playerScore++;
    updateScoreboard();
    resetBall();
  }
}

function updateScoreboard() {
  scoreboard.textContent = `PLAYER: ${playerScore} // QUANTUM AI: ${aiScore}`;
}

function draw() {
  // Clear screen with trailing effect
  ctx.fillStyle = 'rgba(8, 8, 26, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Center Line (Quantum split)
  ctx.strokeStyle = 'rgba(121, 40, 202, 0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 15]);
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw Player Paddle
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00f2fe';
  ctx.fillStyle = '#00f2fe';
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Draw AI Paddle
  ctx.shadowColor = '#ff6482';
  ctx.fillStyle = '#ff6482';
  ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

  // Draw Ball
  ctx.shadowColor = ball.color;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
